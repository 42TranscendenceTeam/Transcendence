# Docker Compose configuration for Frontend only
# Run with: make all

# TODO: Check what to do with volumes for the frontend and backend
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "443:443"
    env_file:
      - frontend/.env
    networks:
      - transcendence
    restart:
      on-failure

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "5555:5555"
    env_file:
      - backend/.env
    networks:
      - transcendence
    restart:
      on-failure

  postgresql:
    image: postgres:16-alpine
    container_name: postgresql
    env_file:
      - postgres/.env
    volumes:
      - ${HOME}/data/database:/var/lib/postgresql/data
    networks:
      - transcendence
    restart:
      on-failure

networks:
  transcendence:
    name: transcendence
    driver: bridge
