# Docker Compose configuration for Frontend only
# Run with: make all

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ttm-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:5000
      - VITE_WS_URL=ws://localhost:5000
    networks:
      - ttm-network
    restart: unless-stopped

networks:
  ttm-network:
    driver: bridge