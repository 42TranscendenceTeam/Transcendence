# Docker Compose configuration for Frontend only
# Run with: make all
# Security: Browser connections use HTTPS (port 443), internal backend can use HTTP

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ttm-frontend
    ports:
      - "3000:443"
    environment:
      - VITE_API_URL=/api
      - VITE_WS_URL=wss://backend:3000
    networks:
      - ttm-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  ttm-network:
    driver: bridge